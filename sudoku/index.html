<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ji’s Baby Sudoku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <header>
            <h1>Ji’s Baby Sudoku</h1>
            <div class="game-controls">
                <label for="difficulty">難度：</label>
                <select id="difficulty">
                    <option value="easy">簡單</option>
                    <option value="medium">中等</option>
                    <option value="hard">困難</option>
                    <option value="expert">專家</option>
                    <option value="pro">專業</option>
                    <option value="master">大師</option>
                    <option value="hell">地獄</option>
                </select>
            </div>
            <!-- 計時器（每秒更新） -->
            <div id="timer-display">⏱️ 計時：00:00</div>
        </header>

        <div id="validation-result"></div>
        
        <div id="game-board"></div>

        <div id="number-palette">
            <!-- Numbers 1-9 and an eraser will be generated by JS -->
        </div>

        <div class="action-buttons">
            <button id="check-btn">驗證答案</button>
            <button id="new-game-btn">新遊戲</button>
            <button id="share-btn">分享題目</button>
            <button id="solve-btn">直接看答案</button>
            <button onclick="window.location.href='../index.html'">回首頁</button>
        </div>
    </div>

    <!-- 分享彈窗 -->
    <div id="share-modal-overlay">
        <div class="share-modal">
            <h2>分享目前題目</h2>
            <p>複製下方網址，對方可直接開啟同一題</p>
            <div class="share-url-row">
                <input id="share-url-input" type="text" readonly>
                <button id="copy-share-url-btn">複製網址</button>
            </div>
            <div id="share-copy-status"></div>
            <div class="share-modal-actions">
                <button id="close-share-modal-btn">關閉</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
